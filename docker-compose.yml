version: '3.8'

# =================================================================
# AgroAI – Docker Compose (Production-like local stack)
# =================================================================
# BEFORE RUNNING:
#   1. Copy .env.example to .env and fill in all required values.
#   2. Place your Firebase service-account JSON at ./secrets/firebase-service-account.json
#   3. Run:  docker compose up --build
# =================================================================

services:

  # ── Frontend (React SPA via Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend (Spring Boot) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      AGROAI_AI_SERVICE_BASE_URL: http://ai-service:8000
      AGROAI_AI_SERVICE_KEY: ${AGROAI_AI_SERVICE_KEY}
      AGROAI_ALLOWED_ORIGINS: ${AGROAI_ALLOWED_ORIGINS}
      AGROAI_STORAGE_PROVIDER: ${AGROAI_STORAGE_PROVIDER:-none}
      AGROAI_GCS_BUCKET_NAME: ${AGROAI_GCS_BUCKET_NAME:-}
      AGROAI_IRRIGATION_MOISTURE_THRESHOLD_PERCENT: ${AGROAI_IRRIGATION_MOISTURE_THRESHOLD_PERCENT:-40}
      AGROAI_IRRIGATION_THRESHOLD_SOURCE: ${AGROAI_IRRIGATION_THRESHOLD_SOURCE:-operator-manual}
      AGROAI_IRRIGATION_THRESHOLD_VERSION: ${AGROAI_IRRIGATION_THRESHOLD_VERSION:-unconfigured}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # ── AI Service (Python FastAPI) ──────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_SECRET_KEY: ${AGROAI_AI_SERVICE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

# NOTE: No volumes for persistent data are defined here because all
# application state is stored in Cloud Firestore and Google Cloud Storage.
# Local image uploads in development use the filesystem path configured
# via AGROAI_STORAGE_PROVIDER=local — do not use this in production.
